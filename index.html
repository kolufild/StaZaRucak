<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planer Obroka</title>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@300;400;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --cream: #FBF8F3;
            --terracotta: #D4734B;
            --olive: #6B7F5E;
            --sage: #A8B89E;
            --charcoal: #3A3A3A;
            --sand: #E8DED0;
            --warm-white: #FFFBF7;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Work Sans', sans-serif;
            background: linear-gradient(135deg, var(--cream) 0%, var(--warm-white) 100%);
            color: var(--charcoal);
            min-height: 100vh;
            padding: 2rem 1rem;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: -50%;
            right: -20%;
            width: 80%;
            height: 80%;
            background: radial-gradient(circle, rgba(212, 115, 75, 0.08) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        h1 {
            font-family: 'Merriweather', serif;
            font-size: 3rem;
            font-weight: 300;
            color: var(--terracotta);
            margin-bottom: 0.5rem;
            letter-spacing: -0.02em;
            animation: fadeInDown 0.8s ease;
        }

        .subtitle {
            font-size: 1.1rem;
            color: var(--olive);
            margin-bottom: 3rem;
            font-weight: 400;
            animation: fadeInDown 0.8s ease 0.1s backwards;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 4px 20px rgba(58, 58, 58, 0.08);
            border: 1px solid rgba(168, 184, 158, 0.2);
            animation: fadeInUp 0.6s ease;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(58, 58, 58, 0.12);
        }

        .card h2 {
            font-family: 'Merriweather', serif;
            font-size: 1.8rem;
            color: var(--olive);
            margin-bottom: 1.5rem;
            font-weight: 400;
        }

        .input-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--charcoal);
            font-weight: 500;
            font-size: 0.95rem;
        }

        input[type="text"],
        input[type="number"] {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 2px solid var(--sand);
            border-radius: 8px;
            font-family: 'Work Sans', sans-serif;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: var(--warm-white);
        }

        input[type="text"]:focus,
        input[type="number"]:focus {
            outline: none;
            border-color: var(--terracotta);
            background: white;
            box-shadow: 0 0 0 3px rgba(212, 115, 75, 0.1);
        }

        .btn {
            padding: 0.85rem 1.8rem;
            border: none;
            border-radius: 8px;
            font-family: 'Work Sans', sans-serif;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-block;
            text-decoration: none;
        }

        .btn-primary {
            background: var(--terracotta);
            color: white;
            box-shadow: 0 4px 12px rgba(212, 115, 75, 0.3);
        }

        .btn-primary:hover {
            background: #c4633b;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(212, 115, 75, 0.4);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: var(--sage);
            color: white;
        }

        .btn-secondary:hover {
            background: #98a88e;
            transform: translateY(-2px);
        }

        .btn-outline {
            background: transparent;
            color: var(--olive);
            border: 2px solid var(--sage);
        }

        .btn-outline:hover {
            background: var(--sage);
            color: white;
        }

        .btn-warn {
            background: #E8A87C;
            color: white;
        }

        .btn-warn:hover {
            background: #d89866;
            transform: translateY(-2px);
        }

        .meal-list {
            display: grid;
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .meal-item {
            background: linear-gradient(135deg, var(--warm-white) 0%, #FFF 100%);
            padding: 1.25rem;
            border-radius: 12px;
            border: 1px solid var(--sand);
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
            animation: scaleIn 0.4s ease;
        }

        .meal-item:hover {
            border-color: var(--sage);
            box-shadow: 0 2px 12px rgba(168, 184, 158, 0.15);
        }

        .meal-info {
            flex: 1;
        }

        .meal-name {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--charcoal);
            margin-bottom: 0.3rem;
        }

        .meal-frequency {
            font-size: 0.9rem;
            color: var(--olive);
        }

        .meal-actions {
            display: flex;
            gap: 0.5rem;
        }

        .btn-small {
            padding: 0.5rem 1rem;
            font-size: 0.85rem;
        }

        .suggestion-card {
            background: linear-gradient(135deg, var(--terracotta) 0%, #c4633b 100%);
            color: white;
            text-align: center;
            padding: 3rem 2rem;
            animation: scaleIn 0.5s ease;
        }

        .suggestion-card h3 {
            font-family: 'Merriweather', serif;
            font-size: 1.2rem;
            font-weight: 300;
            margin-bottom: 1rem;
            opacity: 0.9;
        }

        .suggested-meal {
            font-family: 'Merriweather', serif;
            font-size: 2.5rem;
            font-weight: 400;
            margin-bottom: 2rem;
            letter-spacing: -0.01em;
        }

        .suggestion-buttons {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            max-width: 400px;
            margin: 0 auto;
        }

        .suggestion-buttons .btn {
            background: white;
            color: var(--charcoal);
            width: 100%;
        }

        .suggestion-buttons .btn:hover {
            background: var(--warm-white);
        }

        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--olive);
        }

        .empty-state p {
            font-size: 1.1rem;
            margin-bottom: 1rem;
        }

        .tabs {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            border-bottom: 2px solid var(--sand);
            animation: fadeInDown 0.6s ease 0.2s backwards;
        }

        .tab {
            padding: 1rem 1.5rem;
            background: none;
            border: none;
            font-family: 'Work Sans', sans-serif;
            font-size: 1rem;
            font-weight: 500;
            color: var(--olive);
            cursor: pointer;
            position: relative;
            transition: all 0.3s ease;
        }

        .tab:hover {
            color: var(--terracotta);
        }

        .tab.active {
            color: var(--terracotta);
        }

        .tab.active::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            right: 0;
            height: 2px;
            background: var(--terracotta);
        }

        .view {
            display: none;
        }

        .view.active {
            display: block;
        }

        .edit-mode {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        .edit-mode input {
            width: 80px;
        }

        .loading {
            text-align: center;
            padding: 2rem;
            color: var(--olive);
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2.2rem;
            }

            .meal-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 1rem;
            }

            .meal-actions {
                width: 100%;
                justify-content: flex-start;
            }

            .tabs {
                overflow-x: auto;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Planer Obroka</h1>
        <p class="subtitle">Tvoj pomoćnik za odluke o ručku</p>

        <div class="tabs">
            <button class="tab active" onclick="switchTab('suggest')">Šta da Spremim</button>
            <button class="tab" onclick="switchTab('manage')">Upravljaj Obrocima</button>
        </div>

        <!-- Suggestion View -->
        <div id="suggest-view" class="view active">
            <div id="suggestion-container">
                <div class="loading">Učitavam...</div>
            </div>
        </div>

        <!-- Manage View -->
        <div id="manage-view" class="view">
            <div class="card">
                <h2>Dodaj Novi Obrok</h2>
                <div class="input-group">
                    <label for="meal-name">Naziv Obroka</label>
                    <input type="text" id="meal-name" placeholder="npr. Carbonara">
                </div>
                <div class="input-group">
                    <label for="meal-frequency">Koliko često? (u danima)</label>
                    <input type="number" id="meal-frequency" placeholder="npr. 7" min="1" value="7">
                </div>
                <button class="btn btn-primary" onclick="addMeal()">Dodaj Obrok</button>
            </div>

            <div class="card">
                <h2>Tvoji Obroci</h2>
                <div id="meals-list" class="meal-list">
                    <div class="loading">Učitavam...</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getFirestore, collection, doc, getDocs, setDoc, deleteDoc, onSnapshot } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyCwukFznZb7jGMDdKp6_xfILV6lCXsqaPE",
            authDomain: "stazarucak.firebaseapp.com",
            projectId: "stazarucak",
            storageBucket: "stazarucak.firebasestorage.app",
            messagingSenderId: "733102819005",
            appId: "1:733102819005:web:554c6f4d10512755b319d4",
            measurementId: "G-677CQR1Y16"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Global variables
        let meals = [];
        let skipUntil = {};

        // Real-time listener for meals
        onSnapshot(collection(db, 'meals'), (snapshot) => {
            meals = [];
            snapshot.forEach((doc) => {
                meals.push({ id: doc.id, ...doc.data() });
            });
            renderMealsList();
            renderSuggestion();
        });

        // Real-time listener for skipUntil
        onSnapshot(collection(db, 'skipUntil'), (snapshot) => {
            skipUntil = {};
            snapshot.forEach((doc) => {
                skipUntil[doc.id] = doc.data().skipDate;
            });
            renderSuggestion();
        });

        // Add meal to Firebase
        window.addMeal = async function() {
            const name = document.getElementById('meal-name').value.trim();
            const frequency = parseInt(document.getElementById('meal-frequency').value);

            if (!name) {
                alert('Molim te unesi naziv obroka');
                return;
            }

            if (!frequency || frequency < 1) {
                alert('Molim te unesi validnu učestalost (najmanje 1 dan)');
                return;
            }

            const mealId = Date.now().toString();
            
            try {
                await setDoc(doc(db, 'meals', mealId), {
                    name: name,
                    frequency: frequency,
                    lastMade: null
                });

                document.getElementById('meal-name').value = '';
                document.getElementById('meal-frequency').value = '7';

                alert('Obrok uspešno dodat!');
            } catch (error) {
                console.error('Greška:', error);
                alert('Greška pri dodavanju obroka. Pokušaj ponovo.');
            }
        };

        // Delete meal from Firebase
        window.deleteMeal = async function(id) {
            if (confirm('Da li si siguran da želiš da obrišeš ovaj obrok?')) {
                try {
                    await deleteDoc(doc(db, 'meals', id));
                    // Also delete from skipUntil if exists
                    try {
                        await deleteDoc(doc(db, 'skipUntil', id));
                    } catch (e) {
                        // Doesn't exist, that's ok
                    }
                } catch (error) {
                    console.error('Greška:', error);
                    alert('Greška pri brisanju obroka.');
                }
            }
        };

        // Edit meal
        window.editMeal = function(id) {
            const meal = meals.find(m => m.id === id);
            if (!meal) return;

            const container = document.querySelector(`[data-meal-id="${id}"]`);
            const infoDiv = container.querySelector('.meal-info');
            
            infoDiv.innerHTML = `
                <div class="edit-mode">
                    <input type="text" id="edit-name-${id}" value="${meal.name}" />
                    <input type="number" id="edit-freq-${id}" value="${meal.frequency}" min="1" />
                    <button class="btn btn-small btn-primary" onclick="saveEdit('${id}')">Sačuvaj</button>
                    <button class="btn btn-small btn-outline" onclick="renderMealsList()">Otkaži</button>
                </div>
            `;
        };

        // Save edited meal
        window.saveEdit = async function(id) {
            const name = document.getElementById(`edit-name-${id}`).value.trim();
            const frequency = parseInt(document.getElementById(`edit-freq-${id}`).value);

            if (!name || !frequency || frequency < 1) {
                alert('Molim te unesi validne vrednosti');
                return;
            }

            const meal = meals.find(m => m.id === id);
            if (meal) {
                try {
                    await setDoc(doc(db, 'meals', id), {
                        name: name,
                        frequency: frequency,
                        lastMade: meal.lastMade
                    });
                } catch (error) {
                    console.error('Greška:', error);
                    alert('Greška pri izmeni obroka.');
                }
            }
        };

        // Switch tabs
        window.switchTab = function(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            
            if (tab === 'suggest') {
                document.querySelector('.tab:nth-child(1)').classList.add('active');
                document.getElementById('suggest-view').classList.add('active');
                renderSuggestion();
            } else {
                document.querySelector('.tab:nth-child(2)').classList.add('active');
                document.getElementById('manage-view').classList.add('active');
                renderMealsList();
            }
        };

        // Render meals list
        window.renderMealsList = function() {
            const container = document.getElementById('meals-list');
            
            if (meals.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <p>Još nemaš obroka!</p>
                        <p style="font-size: 0.9rem;">Dodaj svoj prvi obrok iznad da počneš.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = meals.map(meal => `
                <div class="meal-item" data-meal-id="${meal.id}">
                    <div class="meal-info">
                        <div class="meal-name">${meal.name}</div>
                        <div class="meal-frequency">Svakih ${meal.frequency} ${meal.frequency === 1 ? 'dan' : meal.frequency < 5 ? 'dana' : 'dana'} · ${meal.lastMade ? `Poslednji put: ${new Date(meal.lastMade).toLocaleDateString('sr-RS')}` : 'Nikad spremljeno'}</div>
                    </div>
                    <div class="meal-actions">
                        <button class="btn btn-small btn-secondary" onclick="editMeal('${meal.id}')">Izmeni</button>
                        <button class="btn btn-small btn-outline" onclick="deleteMeal('${meal.id}')">Obriši</button>
                    </div>
                </div>
            `).join('');
        };

        // Get next suggestion
        function getNextSuggestion() {
            const today = new Date();
            today.setHours(0, 0, 0, 0);

            // Filter out meals that are skipped
            const availableMeals = meals.filter(meal => {
                if (skipUntil[meal.id]) {
                    const skipDate = new Date(skipUntil[meal.id]);
                    if (skipDate > today) {
                        return false; // Still skipped
                    }
                }
                return true;
            });

            if (availableMeals.length === 0) {
                return null;
            }

            // Calculate next date for each meal
            const mealsWithNext = availableMeals.map(meal => {
                let nextDate;
                if (meal.lastMade) {
                    const lastMadeDate = new Date(meal.lastMade);
                    nextDate = new Date(lastMadeDate);
                    nextDate.setDate(nextDate.getDate() + meal.frequency);
                } else {
                    nextDate = new Date(0); // Never made = highest priority
                }
                return { ...meal, nextDate };
            });

            // Sort by next date (earliest first)
            mealsWithNext.sort((a, b) => a.nextDate - b.nextDate);

            return mealsWithNext[0];
        }

        // Mark meal as made
        window.markMade = async function(id) {
            const meal = meals.find(m => m.id === id);
            if (meal) {
                try {
                    await setDoc(doc(db, 'meals', id), {
                        name: meal.name,
                        frequency: meal.frequency,
                        lastMade: new Date().toISOString()
                    });
                } catch (error) {
                    console.error('Greška:', error);
                    alert('Greška pri ažuriranju obroka.');
                }
            }
        };

        // Skip meal (just refresh suggestion)
        window.skipMeal = function(id) {
            renderSuggestion();
        };

        // Skip meal for days
        window.skipForDays = async function(id) {
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const skipDate = new Date(today);
            skipDate.setDate(skipDate.getDate() + 3); // Skip for 3 days
            
            try {
                await setDoc(doc(db, 'skipUntil', id), {
                    skipDate: skipDate.toISOString()
                });
            } catch (error) {
                console.error('Greška:', error);
                alert('Greška pri preskakanju obroka.');
            }
        };

        // Render suggestion
        window.renderSuggestion = function() {
            const container = document.getElementById('suggestion-container');
            
            if (meals.length === 0) {
                container.innerHTML = `
                    <div class="card empty-state">
                        <p>Još nemaš obroka u listi!</p>
                        <p style="font-size: 0.9rem; margin-top: 1rem;">Idi na "Upravljaj Obrocima" da dodaš neke obroke.</p>
                    </div>
                `;
                return;
            }

            const suggestion = getNextSuggestion();

            if (!suggestion) {
                container.innerHTML = `
                    <div class="card empty-state">
                        <p>Svi obroci su trenutno preskočeni!</p>
                        <p style="font-size: 0.9rem; margin-top: 1rem;">Proveri ponovo za nekoliko dana ili upravljaj svojim obrocima.</p>
                    </div>
                `;
                return;
            }

            const daysOverdue = suggestion.lastMade 
                ? Math.floor((new Date() - suggestion.nextDate) / (1000 * 60 * 60 * 24))
                : null;

            let statusText = '';
            if (!suggestion.lastMade) {
                statusText = 'Još nisi spremio ovo';
            } else if (daysOverdue > 0) {
                statusText = `Kasni za ${daysOverdue} ${daysOverdue === 1 ? 'dan' : daysOverdue < 5 ? 'dana' : 'dana'}`;
            } else if (daysOverdue === 0) {
                statusText = 'Danas na redu';
            } else {
                const daysUntil = Math.abs(daysOverdue);
                statusText = `Nije još na redu (za ${daysUntil} ${daysUntil === 1 ? 'dan' : daysUntil < 5 ? 'dana' : 'dana'})`;
            }

            container.innerHTML = `
                <div class="card suggestion-card">
                    <h3>Šta kažeš na...</h3>
                    <div class="suggested-meal">${suggestion.name}</div>
                    <p style="opacity: 0.9; margin-bottom: 2rem;">${statusText}</p>
                    <div class="suggestion-buttons">
                        <button class="btn" onclick="markMade('${suggestion.id}')">✓ OK, spravićemo to</button>
                        <button class="btn" onclick="skipMeal('${suggestion.id}')">→ Ne, predloži nešto drugo</button>
                        <button class="btn" onclick="skipForDays('${suggestion.id}')">⏸ Preskoči za nekoliko dana</button>
                    </div>
                </div>
            `;
        };
    </script>
</body>
</html>
